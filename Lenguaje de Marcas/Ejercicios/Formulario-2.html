<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario google y bing</title>
</head>
<body>
    <h2>Ejercicio 5: Buscadores</h2>
    <form action="http://www.google.com/search " method="get" >
        <label for="google"><img src="Imagenes/google logo.png" width="90" align="bottom"></label>
        <input type="text" name="q" id="google">
        <input type="submit" value="Busqueda Google">
    </form>
    <br>
    
    <form action="http://www.bing.com/search " method="get">
        <label for="google"><img src="Imagenes/Bing logo.png" width="90" align="bottom"></label>
        <input type="text" name="q" id="bing">
        <input type="submit" value="Busqueda Bing">
    </form>
</body>

</html>
